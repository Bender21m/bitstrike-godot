name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* \
            $HOME/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          cp -r /root/.local/share/godot/export_templates/4.3.stable.mono/* \
            $HOME/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true

      - name: Import assets with Godot editor
        run: |
          # Run editor headless to trigger asset imports (.glb -> .scn, .png -> .ctex, etc)
          # This is the critical step that makes 3D models work in export
          mkdir -p .godot/imported
          godot --headless --editor --quit 2>&1 || true
          # Run it twice to ensure all imports complete
          godot --headless --editor --quit 2>&1 || true
          echo "Import cache:"
          ls .godot/imported/ 2>/dev/null | wc -l
          echo "files imported"

      - name: Export for Web
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html
          ls -la export/web/

      - name: Verify export
        run: |
          if [ ! -f "export/web/index.html" ]; then
            echo "Export failed - index.html not found"
            exit 1
          fi
          echo "Export successful!"
          ls -lh export/web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
