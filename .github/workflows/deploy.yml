name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          # barichello/godot-ci stores templates in /root/ but GitHub Actions
          # runs as a different user, so HOME=/github/home
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          # Copy from wherever they exist in the image
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* \
            $HOME/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          # Also try the mono path
          cp -r /root/.local/share/godot/export_templates/4.3.stable.mono/* \
            $HOME/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          echo "Templates at $HOME/.local/share/godot/export_templates/4.3.stable/:"
          ls $HOME/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || echo "No templates found"

      - name: Export for Web
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html
          ls -la export/web/

      - name: Verify export
        run: |
          if [ ! -f "export/web/index.html" ]; then
            echo "Export failed - index.html not found"
            exit 1
          fi
          echo "Export successful!"
          ls -lh export/web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
