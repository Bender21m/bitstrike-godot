name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/4.3.stable
          mv /root/.local/share/godot/export_templates/4.3.stable.mono/* /root/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          # The barichello image already has templates, but let's make sure web is there
          ls /root/.local/share/godot/export_templates/4.3.stable/ | head -5

      - name: Export for Web
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html 2>&1 || true
          ls -la export/web/

      - name: Verify export
        run: |
          if [ ! -f "export/web/index.html" ]; then
            echo "Export failed - index.html not found"
            exit 1
          fi
          echo "Export successful!"
          ls -lh export/web/

      - name: Add COOP/COEP headers
        run: |
          # SharedArrayBuffer requires these headers for threaded builds
          # GitHub Pages uses a custom 404 approach, but we can add a _headers file
          cat > export/web/_headers << 'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
